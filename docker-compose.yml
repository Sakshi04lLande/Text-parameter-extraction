

services:
  mental-health-api:
    container_name: mental-health-api

    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8025:8025"

    env_file:
      - .env

    restart: unless-stopped

    command: >
      uvicorn app:app
      --host 0.0.0.0
      --port 8025
      --workers 1

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8025/docs"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 2G

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"