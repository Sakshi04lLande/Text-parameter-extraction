version: "3.9"

services:
mental-health-api:
build: .
container_name: mental-health-api
ports:
- "8025:8025"   

```
restart: always

environment:
  - PYTHONUNBUFFERED=1

deploy:
  resources:
    limits:
      memory: 4g
    reservations:
      memory: 2g

healthcheck:
  test: ["CMD", "curl", "-f", "http://localhost:8025/docs"]  
  interval: 30s
  timeout: 10s
  retries: 3
```
